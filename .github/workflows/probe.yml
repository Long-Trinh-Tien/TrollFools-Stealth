name: Runner Probe

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - macos-15
          - macos-14-large
          - macos-14-xlarge
          - macos-15-large
    runs-on: ${{ matrix.os }}
    steps:
      - name: Identity
        run: |
          sw_vers
          uname -m
          xcodebuild -version || true
